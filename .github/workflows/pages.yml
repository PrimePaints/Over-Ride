name: Deploy to GitHub Pages

# The github-pages environment only permits deploys from the repo's default
# branch. Triggering on other branches creates runs that get rejected — and
# via the concurrency group they can cancel the run that would have worked.
on:
  push:
    branches: [claude/override-cognitive-app-5jcnna]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
